<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Issues Tracker</title>
  <link rel="shortcut icon" href="assets/github-logo.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#1f1f1f]">
  <main id="loginScreen" class="min-h-screen grid place-items-center p-5">
    <section class="w-full max-w-[470px] bg-white border-2 border-dotted border-sky-500 px-7 py-9 text-center">
      <img class="w-20 h-20 object-contain mx-auto mb-5" src="assets/github-logo.png" alt="GitHub logo">
      <h1 class="text-2xl font-bold">GitHub Issues Tracker</h1>
      <p class="text-sm text-slate-500 mt-2 mb-7">Sign in to manage your issues</p>

      <form id="loginForm" class="text-left space-y-3">
        <label class="font-bold text-sm" for="username">Username</label>
        <input id="username" class="input input-bordered w-full" name="username" type="text" placeholder="Enter Username">
        <p class="text-xs text-violet-700">Default: admin</p>

        <label class="font-bold text-sm" for="password">Password</label>
        <input id="password" class="input input-bordered w-full" name="password" type="password" placeholder="Enter Password">
        <p class="text-xs text-violet-700">Default: admin123</p>

        <p id="loginError" class="min-h-5 text-xs font-semibold text-red-500"></p>
        <button class="btn w-full bg-[#4c00ff] text-white border-0 hover:bg-[#3100b8]" type="submit">Sign In</button>
      </form>

      <div class="divider text-xs text-slate-500 my-6">OR</div>
      <div class="bg-slate-50 rounded-md p-5 text-sm">
        <p class="text-xs text-slate-500 mb-3">Demo Credentials:</p>
        <p><strong>Username:</strong> admin</p>
        <p><strong>Password:</strong> admin123</p>
      </div>
    </section>
  </main>

  <main id="appScreen" class="hidden min-h-screen bg-slate-50 pb-12">
    <nav class="bg-white shadow-sm">
      <div class="max-w-6xl mx-auto px-5 py-4 flex flex-col md:flex-row gap-4 items-center justify-between">
        <a href="#" class="flex items-center gap-2 font-extrabold">
          <img class="w-7 h-7" src="assets/github-logo.png" alt="">
          <span>GitHub Issues Tracker</span>
        </a>

        <form id="searchForm" class="join w-full md:w-auto">
          <input id="searchInput" class="input input-bordered join-item w-full md:w-72" type="search" placeholder="Search Issues...">
          <button class="btn join-item bg-[#4c00ff] text-white border-0 hover:bg-[#3100b8]" type="submit">Search</button>
        </form>
      </div>
    </nav>

    <section class="max-w-4xl mx-auto px-4 mt-10">
      <div class="bg-white border border-slate-200 shadow-sm p-4 rounded-t-md flex gap-3">
        <button class="tab active btn btn-sm min-w-20" data-filter="all" type="button">All</button>
        <button class="tab btn btn-sm min-w-20" data-filter="open" type="button">Open</button>
        <button class="tab btn btn-sm min-w-20" data-filter="closed" type="button">Closed</button>
      </div>

      <div class="bg-white border-x border-slate-200 shadow-sm px-5 py-4 flex flex-col sm:flex-row gap-4 justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-violet-100 grid place-items-center">
            <img class="w-5" src="assets/Aperture.png" alt="">
          </div>
          <div>
            <h2 class="font-bold"><span id="issueCount">0</span> Issues</h2>
            <p id="summaryText" class="text-xs text-slate-500">Track and manage your project issues</p>
          </div>
        </div>
        <div class="flex items-center gap-4 text-xs font-bold">
          <span class="flex items-center gap-1"><img class="w-2.5 h-2.5" src="assets/Open-Status.png" alt=""> Open</span>
          <span class="flex items-center gap-1"><img class="w-2.5 h-2.5" src="assets/Closed- Status .png" alt=""> Closed</span>
        </div>
      </div>

      <section id="loader" class="hidden py-10 text-center">
        <span class="loading loading-spinner loading-lg text-[#4c00ff]"></span>
      </section>

      <p id="emptyState" class="hidden bg-white border border-dashed border-slate-300 p-6 text-center text-slate-500"></p>
      <section id="issueGrid" class="bg-white border border-slate-200 border-t-0 shadow-sm rounded-b-md p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2"></section>
    </section>
  </main>

  <div id="issueModal" class="hidden fixed inset-0 z-50 grid place-items-center p-5">
    <div class="absolute inset-0 bg-slate-700/55" data-close-modal></div>
    <article class="relative z-10 w-full max-w-xl bg-white rounded-lg shadow-xl p-7">
      <div id="modalContent"></div>
      <button class="btn mt-5 ml-auto flex bg-[#4c00ff] text-white border-0 hover:bg-[#3100b8]" type="button" data-close-modal>Close</button>
    </article>
  </div>

  <script src="app.js"></script>
</body>
</html>
